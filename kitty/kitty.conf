include ./spaceduck.conf

font_family CaskaydiaCove Nerd Font Mono
# The Nerd Font has no Hangul; these ranges come from Pretendard.
symbol_map U+1100-U+11FF,U+3130-U+318F,U+AC00-U+D7A3 Pretendard
modify_font cell_width 90%
font_size 11.0

cursor_shape beam
cursor_trail 1

# One pointer shape everywhere, instead of kitty switching between beam,
# crosshair and arrow (arrow as soon as nvim grabs the mouse).
default_pointer_shape arrow
pointer_shape_when_dragging arrow arrow
pointer_shape_when_grabbed arrow

# The default 10 ms repaint_delay caps at ~100 FPS, which judders on 144 Hz;
# 6 ms fits a 144 Hz frame (6.94 ms), and sync_to_monitor keeps it vblank-paced.
repaint_delay 6
input_delay 1
sync_to_monitor yes

# Matched to foot's padding.
window_margin_width 21.75

confirm_os_window_close 0

shell zsh

copy_on_select yes
map ctrl+c    copy_or_interrupt
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Scrollback search: the search.py kitten, which marks matches through scroll_mark.py.
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

map page_up    scroll_page_up
map page_down    scroll_page_down

# Scrollback without arrows or PageUp.
map ctrl+shift+k    scroll_line_up
map ctrl+shift+j    scroll_line_down
# ctrl+shift+h (scrollback) and ctrl+shift+g (last output) in nvim; q quits.
# The text goes through a file so nvim's terminal draws its colours: one in
# nvim's private temporary directory, removed when nvim exits. A fixed /tmp
# path was readable by every user and clobbered by a second pager. -i NONE:
# no shada, so searches and yanks in the scrollback never reach the history
# file the everyday nvim keeps.
scrollback_pager nvim -u NONE -i NONE -c "map q :qa!<CR>" -c "set clipboard=unnamedplus" -c "let g:scrollback = tempname() | silent execute 'write! ' .. fnameescape(g:scrollback) | execute 'terminal head -c -1 ' .. shellescape(g:scrollback)" -c "autocmd VimEnter * normal! G" -

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
