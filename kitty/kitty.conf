# Theming (spaceduck source-of-truth lives in ~/workspace, install-proof)
include ./spaceduck.conf

# Font
font_family CaskaydiaCove Nerd Font Mono
symbol_map U+1100-U+11FF,U+3130-U+318F,U+AC00-U+D7A3 Pretendard
modify_font cell_width 90%
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Mouse pointer
#
# Not the same thing as cursor_shape above, which is the caret inside the
# terminal. These three are the mouse pointer, and kitty moves it between three
# shapes by default: beam over text, crosshair while a rectangular selection is
# being dragged, and arrow whenever a program running inside grabs the mouse,
# which nvim does the moment it starts.
#
# All three hold the same value here, so the pointer over a terminal window is
# one shape and stays it. arrow rather than kitty's beam because arrow is the
# shape the theme draws, and because a pointer that changes shape is announcing
# a mode that was never chosen.
default_pointer_shape arrow
pointer_shape_when_dragging arrow arrow
pointer_shape_when_grabbed arrow

# Redraw pacing for the 144 Hz and 120 Hz panels this runs on.
#
# The default repaint_delay of 10 ms caps kitty at roughly 100 FPS. That is not
# simply "fewer frames" on a 144 Hz panel: 100 into 144 does not divide, so the
# frames land between refreshes and the cursor reads as juddering rather than as
# slow. 6 ms clears the 6.94 ms a 144 Hz refresh allows.
#
# This raises a ceiling, it does not spend frames. sync_to_monitor still pins
# presentation to vblank, so kitty draws when the panel is ready and no more
# often, and an idle terminal still costs nothing.
repaint_delay 6
input_delay 1
sync_to_monitor yes

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use zsh shell
shell zsh

# Copy
copy_on_select yes
map ctrl+c    copy_or_interrupt
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

# Vim-style scrollback (HHKB-friendly: no arrows / PageUp)
map ctrl+shift+k    scroll_line_up
map ctrl+shift+j    scroll_line_down
# ctrl+shift+h -> whole scrollback in nvim, ctrl+shift+g -> last command's output
scrollback_pager nvim -u NONE -c "map q :qa!<CR>" -c "set clipboard=unnamedplus" -c "silent write! /tmp/kitty_scrollback_buffer | te head -c -1 /tmp/kitty_scrollback_buffer" -c "autocmd VimEnter * normal! G" -

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
