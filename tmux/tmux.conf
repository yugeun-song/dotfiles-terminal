# Vi keys in copy-mode
set -g mode-keys vi
set -g history-limit 50000
set -sg escape-time 10

# prefix + [ still works too
bind Enter copy-mode
bind v     copy-mode

# y and Enter copy to the Wayland clipboard (needs wl-copy)
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Enter  send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Escape send -X cancel

# Prompt jumps need OSC 133 marks; no-op without them
bind -T copy-mode-vi '[' send -X previous-prompt
bind -T copy-mode-vi ']' send -X next-prompt
