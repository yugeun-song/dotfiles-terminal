# Vi navigation over the terminal buffer (copy-mode)
set -g mode-keys vi
set -g history-limit 50000
set -sg escape-time 10

# Enter copy-mode quickly (default prefix + [ still works)
bind Enter copy-mode
bind v     copy-mode

# Vim-feel selection / yank inside copy-mode (y -> Wayland clipboard)
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Enter  send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Escape send -X cancel

# Jump between shell prompts (needs OSC 133 prompt marks; harmless if absent)
bind -T copy-mode-vi '[' send -X previous-prompt
bind -T copy-mode-vi ']' send -X next-prompt
